<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Dadelbude Loading</title>

<style>
body {
    margin: 0;
    overflow: hidden;
    font-family: Arial;
    color: white;
    background: radial-gradient(circle at center, #1a1a1a, #000);
}

/* Hintergrund Animation */
.bg {
    position: absolute;
    width: 200%;
    height: 200%;
    background: linear-gradient(45deg, #ffcc00, #00ccff, #ff00aa);
    animation: move 10s infinite linear;
    opacity: 0.15;
}

@keyframes move {
    0% { transform: translate(0,0); }
    100% { transform: translate(-50%,-50%); }
}

/* Center Box */
.center {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    background: rgba(0,0,0,0.6);
    padding: 30px;
    border-radius: 15px;
    box-shadow: 0 0 20px #000;
    width: 500px;
}

h1 {
    color: #ffcc00;
    margin-bottom: 5px;
}

h2 {
    font-size: 14px;
    color: #aaa;
}

/* Progress Bar */
.bar {
    width: 100%;
    height: 15px;
    background: #222;
    border-radius: 10px;
    margin-top: 20px;
    overflow: hidden;
}

.progress {
    width: 0%;
    height: 100%;
    background: linear-gradient(90deg, #ffcc00, #00ccff);
    animation: load 12s linear forwards;
}

@keyframes load {
    0% { width: 0%; }
    100% { width: 100%; }
}

/* Buttons */
.btn {
    display: inline-block;
    margin-top: 15px;
    padding: 8px 15px;
    background: #00ccff;
    color: black;
    border-radius: 8px;
    text-decoration: none;
    font-weight: bold;
}

.btn:hover {
    background: #ffcc00;
}

/* Footer */
.footer {
    position: absolute;
    bottom: 15px;
    width: 100%;
    text-align: center;
    font-size: 12px;
    color: #777;
}
</style>
</head>

<body>

<div class="bg"></div>

<div class="center">
    <h1>🎮 DADELBUDE TTT 🎮</h1>
    <h2>🌈 Fair • Tolerant • Queerfreundlich • Community</h2>

    <div class="bar">
        <div class="progress"></div>
    </div>

    <a class="btn" href="https://discord.gg/GGt6VDAC2x">💬 Discord beitreten</a>

    <h2 style="margin-top:15px;">🔄 Server wird geladen...</h2>
</div>

<div class="footer">
    💰 Coins | 🧠 TTT2 | 🛒 Pointshop 2 | 👑 ULX | ⚡ Events
</div>

</body>
</html>
